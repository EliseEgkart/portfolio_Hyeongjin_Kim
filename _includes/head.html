<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url != '/' %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
{% assign description = page.description | default: page.intro | default: page.summary | default: site.description %}
<meta name="description" content="{{ description | strip_html | normalize_whitespace | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:title" content="{{ page.title | escape }} | {{ site.title }}">
<meta property="og:description" content="{{ description | strip_html | normalize_whitespace | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.image | default: site.author.avatar | absolute_url }}">
<meta name="theme-color" content="#183b56">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>document.documentElement.classList.replace('no-js','js');</script>
{% if page.url == '/' %}
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":{{ site.author.name | jsonify }},"alternateName":"김형진","url":{{ '/' | absolute_url | jsonify }},"affiliation":{"@type":"Organization","name":"Hanyang University"},"sameAs":["https://github.com/{{ site.author.github }}",{{ site.author.orcid | jsonify }}]}</script>
{% endif %}
